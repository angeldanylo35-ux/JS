<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de let document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;

    }


    input {
        padding: 5px;
        margin-bottom: 10px;
    }

    button {
        padding: 5px 10px;
        background-color: #007BFF;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 10px;
    }

    button:hover {
        background-color: #0056b3;
    }

    #resultado {
        margin-top: 20px;
        font-size: 1.2em;
        color: #333;
    }
</style>



<body>
    <h1>Exemplo de let document</h1>
    <label for="">digite um número:</label>
    <input type="number" id="soma" name="soma">
    <label for="">digite o segundo número:</label>

    <input type="number" id="soma2" name="soma2">
    <button onclick="somar()">clique aqui para somar</button>
    <p id="resultado"></p>
    <script>


        function somar() {
            let numero = document.getElementById("soma").value;
            let numero2 = document.getElementById("soma2").value;
            let resultado = parseInt(numero) + parseInt(numero2);
            document.getElementById("resultado").innerHTML = "O resultado é: " + resultado;
        }
    </script>
</body>

</html>
